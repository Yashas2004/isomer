[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isomer"
version = "0.1.0"
description = "Learned guidance for equational proof search, with a small trusted kernel"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]
# Only isomer.learn.{model,train,infer} import torch. For the GPU, install the CUDA
# wheel first (README); this extra then just checks the version.
learn = ["torch>=2.2"]
# Only `isomer report` needs these; the core package imports and tests without them.
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running; deselect locally with -m 'not slow' (CI runs everything)"]

[tool.ruff]
line-length = 110
target-version = "py310"
